[tool.bumpversion]
current_version = "0.11.0"
commit = true
tag = true
tag_name = "{new_version}"
message = "Use the Force, Luke. Bump version: {current_version} → {new_version}"
setup_hooks = ["git-chglog --version"]
pre_commit_hooks = ["sh scripts/update-changelog.sh"]

[[tool.bumpversion.files]]
filename = "FoundationX.podspec"
